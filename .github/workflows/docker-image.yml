name: Build
on:
  push:
    branches: ['master']
    paths:
      - 'Dockerfile'
      - 'test_sandbox_security.sh'
      - '.github/workflows/docker-image.yml'
  schedule:
    - cron: '0 6 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: none
      attestations: none
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: qwercik/opencode-tools
          path: opencode-tools

      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          severity: style

      - name: Get opencode version
        id: version
        run: |
          OC_VER=$(curl -s https://api.github.com/repos/anomalyco/opencode/releases/latest \
            | jq -r .tag_name)
          echo "tag=$OC_VER" >> $GITHUB_OUTPUT

      - name: Login to ghcr.io
        uses: docker/login-action@v3.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5.5.1
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=${{ steps.version.outputs.tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6.4.0
        with:
          context: .
          push: false
          load: true
          tags: ghcr.io/${{ github.repository }}:test-build-${{ github.sha }}
          build-args: OPENCODE_VERSION=${{ steps.version.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tag and push image
        run: |
          TAGS="${{ steps.meta.outputs.tags }}"
          echo "$TAGS" | while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            echo "-> Pushing $tag"
            docker tag ghcr.io/${{ github.repository }}:test-build-${{ github.sha }} "$tag"
            docker push "$tag"
          done

